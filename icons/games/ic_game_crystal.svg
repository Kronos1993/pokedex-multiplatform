<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Fondo azul cristal -->
  <rect width="48" height="48" fill="#0066BB" rx="4"/>
  <!-- Crystal gem shape -->
  <polygon points="24,4 38,16 38,32 24,44 10,32 10,16" fill="#44CCFF" opacity="0.3"/>
  <polygon points="24,4 38,16 38,32 24,44 10,32 10,16" fill="none" stroke="#88EEFF" stroke-width="1.5"/>
  <!-- Inner crystal -->
  <polygon points="24,10 34,19 34,29 24,38 14,29 14,19" fill="#88DDFF" opacity="0.25"/>

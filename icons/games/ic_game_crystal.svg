  <path d="M6,22 Q12,18 18,22 Q12,26 6,26 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M42,22 Q36,18 30,22 Q36,26 42,26 Z" fill="#FFFFFF" opacity="0.8"/>
  <!-- Crystal sparkles -->
  <line x1="24" y1="6" x2="24" y2="12" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
  <line x1="21" y1="9" x2="27" y2="9" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
  <line x1="10" y1="14" x2="13" y2="17" stroke="#AADDFF" stroke-width="1" opacity="0.8"/>
  <line x1="38" y1="14" x2="35" y2="17" stroke="#AADDFF" stroke-width="1" opacity="0.8"/>
  <!-- Center pokeball -->
  <circle cx="24" cy="28" r="8" fill="#003388" stroke="#88CCFF" stroke-width="1"/>
  <rect x="16" y="26.5" width="16" height="3" fill="#88CCFF"/>
  <circle cx="24" cy="28" r="3.5" fill="#003388" stroke="#88CCFF" stroke-width="1"/>
  <circle cx="24" cy="28" r="2" fill="#AADDFF"/>
</svg>

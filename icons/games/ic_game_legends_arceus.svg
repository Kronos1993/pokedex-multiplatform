<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <rect width="48" height="48" fill="#1A1A2E" rx="4"/>
  <!-- Space-time distortion rings -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
  <circle cx="24" cy="24" r="15" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
  <circle cx="24" cy="24" r="10" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.7"/>
  <!-- Arceus ring -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="4 6"/>
  <!-- Arceus cross/wheel spokes -->
  <line x1="24" y1="6" x2="24" y2="42" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
  <line x1="6" y1="24" x2="42" y2="24" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
  <line x1="11" y1="11" x2="37" y2="37" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
  <line x1="37" y1="11" x2="11" y2="37" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
  <!-- Center -->
  <circle cx="24" cy="24" r="5" fill="#FFD700"/>
  <circle cx="24" cy="24" r="3" fill="#FFFFFF"/>
  <circle cx="24" cy="24" r="1.5" fill="#FFD700"/>
  <!-- Stars -->
  <circle cx="8" cy="8" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="40" cy="10" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="6" cy="38" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="42" cy="40" r="1" fill="#FFFFFF" opacity="0.5"/>
</svg>
